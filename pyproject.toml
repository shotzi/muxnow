[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimux"
version = "0.1.0"
description = "AI-Sidecar für tmux mit verlässlicher Pause und Fail-Closed Redaktion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Concept Factory", email = "dev@concept-factory.internal" }
]
dependencies = [
    "textual>=0.70.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
aimux = "aimux.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aimux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
