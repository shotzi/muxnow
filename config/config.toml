[model]
# LiteLLM Gateway auf CT 200, externer Provider oder lokales LLM
base_url = "http://192.168.70.20:4000/v1"
model = "deepseek-flash"
# Optional: API-Token / Bearer-Key für Gateway oder Provider (kann auch über MUXNOW_API_KEY gesetzt werden)
api_key = ""
timeout_s = 60.0
context_blocks = 5

[capture]
skip_prompt_lines = true
fail_closed = true

[guard]
deny_patterns = [
    "(?i)\\brm\\s+-rf\\s+/",
    "\\bmkfs\\b",
    "\\bdd\\s+if=",
    "iptables\\s+-F",
    ">\\s*/dev/sd",
    "(?i)\\b(shutdown|reboot|poweroff|init\\s+0)\\b"
]
require_confirm = ["destructive", "write"]

[audit]
path = "~/.local/state/muxnow/audit.jsonl"
