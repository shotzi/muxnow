# muxnow tmux configuration bindings
# In .tmux.conf einbinden mit: source-file /path/to/muxnow.conf

# Mitschnitt anhalten / fortsetzen (Hardware-artiger Pipe-Stopp)
# Funktioniert mit p, P, a, A
bind-key p run-shell "muxnow toggle"
bind-key P run-shell "muxnow toggle"
bind-key a run-shell "muxnow toggle"
bind-key A run-shell "muxnow toggle"

# Vorschlag direkt in die aktive Shell einfügen (ohne Fensterwechsel!)
bind-key i run-shell "muxnow insert"
bind-key I run-shell "muxnow execute"

# Bequemer Fensterwechsel zwischen Assistent und Shell
bind-key Tab select-pane -t :.+
bind-key BTab select-pane -t :.-

# Optische Randleiste für aktiven Mitschnittzustand
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_id} · #{?#{==:#{@muxnow_state},off},#[fg=yellow]⏸ [muxnow: PAUSED]#[default],#[fg=green]⏺ [muxnow: ON]#[default]} "
