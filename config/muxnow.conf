# muxnow tmux configuration bindings
# In .tmux.conf einbinden mit: source-file /path/to/muxnow.conf

# Mitschnitt anhalten / fortsetzen (Hardware-artiger Pipe-Stopp)
bind-key A run-shell "muxnow toggle"

# Sidecar-Assistenten für die aktuelle Pane öffnen
bind-key a run-shell "muxnow attach"

# Optische Randleiste für aktiven Mitschnittzustand aktivieren
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_id} · #{?#{==:#{@muxnow_state},on},#[fg=green]⏺ [muxnow: ON]#[default],#[fg=yellow]⏸ [muxnow: PAUSED]#[default]} "
