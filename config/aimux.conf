# aimux tmux configuration bindings
# In .tmux.conf einbinden mit: source-file /path/to/aimux.conf

# Mitschnitt anhalten / fortsetzen (Hardware-artiger Pipe-Stopp)
bind-key A run-shell "aimux toggle"

# Sidecar-Assistenten für die aktuelle Pane öffnen
bind-key a run-shell "aimux attach"

# Optische Randleiste für aktiven Mitschnittzustand aktivieren
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_id} · #{?#{==:#{@aimux_state},on},#[fg=green]⏺ [aimux: ON]#[default],#[fg=yellow]⏸ [aimux: PAUSED]#[default]} "
